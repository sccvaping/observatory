name: Verify canonical SCC Vaping public data

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-validated-public.yml"
      - "data/public/**"
      - "evidence/**"
      - "environment/**"
      - "regulation/**"
      - "provenance/**"
      - "index.html"

permissions:
  contents: read

concurrency:
  group: scc-vaping-canonical-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical Observatory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify publication boundary and release consistency
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_public.py

      - name: Verify active workflows no longer use the legacy relay
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --include='*.yml' --include='*.yaml' 'homegundredaroad/Vaping26' .github/workflows; then
            echo "::error::An active canonical Observatory workflow still depends on the legacy Vaping26 relay."
            exit 1
          fi

      - name: Summarise canonical release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          manifest = json.loads(Path("provenance/publication_manifest.json").read_text(encoding="utf-8"))
          status = json.loads(Path("data/public/research_status.json").read_text(encoding="utf-8"))
          print("## Canonical SCC Vaping publication verified")
          print()
          print(f"- Publication contract: `{manifest.get('publication_contract')}`")
          print(f"- Generated at: `{manifest.get('generated_at')}`")
          print(f"- Manifested files: `{len(manifest.get('files', []))}`")
          print(f"- Successful source pulls: `{status.get('source_coverage', {}).get('successful_sources')}`")
          print("- Legacy relay dependency: `none in active Observatory workflows`")
          PY
