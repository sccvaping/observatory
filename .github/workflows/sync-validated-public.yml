name: Maintain canonical SCC Vaping public data

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-validated-public.yml"
      - "SYNC_REQUEST"

permissions:
  contents: write

concurrency:
  group: scc-vaping-public-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical Observatory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: canonical

      - name: Require direct canonical publication marker
        shell: bash
        run: |
          set -euo pipefail
          test -f canonical/publication-mode.json || { echo "::error::Canonical marker missing; legacy relay is retired"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("canonical/publication-mode.json").read_text(encoding="utf-8"))
          if p.get("mode") != "direct_canonical" or p.get("target") != "sccvaping/observatory":
              raise SystemExit("Invalid canonical publication marker")
          if p.get("source_repository") != "sccvaping/research" or not str(p.get("source_run_id", "")).isdigit():
              raise SystemExit("Invalid canonical publication provenance")
          print("Direct canonical publication provenance verified")
          PY

      - name: Verify canonical branch
        working-directory: canonical
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python scripts/validate_public.py
          if [ -f publication-mode.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("publication-mode.json").read_text(encoding="utf-8"))
          if p.get("mode") != "direct_canonical" or p.get("target") != "sccvaping/observatory":
              raise SystemExit("Canonical publication-mode marker is invalid")
          print("Direct canonical publication mode verified.")
          PY
          else
            echo "Canonical repository currently maintained through the verified historical transport relay."
          fi
          echo "Canonical SCC Vaping public data verified at $(git rev-parse HEAD)"


  deploy:
    name: Deploy verified canonical snapshot
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout canonical main after sync
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: canonical

      - name: Revalidate canonical public release before deployment
        run: python canonical/scripts/validate_public.py

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload verified canonical site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: canonical

      - name: Deploy verified canonical site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
