name: Validate SCC Vaping Observatory

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/public/**"
      - "evidence/**"
      - "environment/**"
      - "regulation/**"
      - "provenance/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/sync-validated-public.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: observatory-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate publication boundary and release consistency
        run: python scripts/validate_public.py
